name: CI Tests

on:
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-tanstack-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './my-tanstack-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
